<title>System Map — Globe</title>
<style>
:root{

  --gold:linear-gradient(100deg,#6f5214 0%,#c99a35 22%,#f6dc8a 42%,#fff3c4 50%,#d8ad4e 62%,#8a6420 100%);

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--ink);color:#fff;overflow:hidden;font-family:system-ui,-apple-system,'Helvetica Neue',sans-serif}
canvas{position:absolute;left:0;top:0;display:block}
#hud{pointer-events:none}
#globe{touch-action:none}
.gold{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:Menlo,ui-monospace,monospace}
#header{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:5;
  background:linear-gradient(180deg,rgba(10,10,10,.96) 70%,rgba(10,10,10,0));pointer-events:none}
#header > *{pointer-events:auto}
#brand{font-size:11px;letter-spacing:.3em;font-weight:800;text-transform:uppercase;white-space:nowrap}
#brand small{font-weight:600;letter-spacing:.2em;color:var(--dim);margin-left:8px}
#crumb{font-size:15px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#crumb .sep{color:var(--faint);margin:0 8px;font-weight:400}
#stats{display:flex;gap:16px;flex-shrink:0}
.stat{text-align:right}.stat b{display:block;font-size:15px;line-height:1}.stat span{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.btn{padding:6px 11px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:rgba(255,255,255,.75);white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.1);color:#fff}
#depth{display:flex;gap:2px;align-items:center}
#depth button{font:700 9px Menlo,monospace;letter-spacing:.1em;padding:5px 7px;border-radius:4px;border:1px solid transparent;background:none;color:var(--faint);cursor:pointer}
#depth button.on{color:#000;background:var(--gold);border-color:#c99a35}
.panel{position:absolute;z-index:4;background:rgba(10,10,10,.9);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:hidden;display:flex;flex-direction:column}
#card{left:14px;top:74px;bottom:14px;width:350px}
#index{right:14px;top:74px;bottom:14px;width:320px}
.ph{padding:12px 14px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
.ph .k{font:700 9px Menlo,monospace;letter-spacing:.16em;color:var(--faint);text-transform:uppercase}
.pb{padding:12px 14px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.pb::-webkit-scrollbar{width:6px}.pb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
#c-title{font-size:21px;font-weight:750;line-height:1.15;margin:6px 0 3px}
#c-type{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font:700 9px Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.mark{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.mark.live{background:var(--gold)}
.mark.hollow{border:1.5px solid var(--gold-solid)}
.mark.dotted{border:1.5px dotted var(--gold-solid)}
.sec{margin-top:14px}.sec h4{font:700 9px Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.sec p{font-size:12.5px;line-height:1.55;color:rgba(255,255,255,.82)}
.sec .tech{font-size:11.5px;font-style:italic;color:var(--dim)}
.note{border-left:1px solid rgba(214,176,87,.45);padding:2px 0 2px 10px;margin:6px 0}
.note summary{cursor:pointer;font:700 10px Menlo,monospace;letter-spacing:.06em;color:var(--gold-solid);list-style:none}
.note summary::-webkit-details-marker{display:none}
.note div{font-size:12px;line-height:1.5;color:rgba(255,255,255,.75);margin-top:4px;white-space:pre-wrap}
.conn{display:flex;gap:8px;align-items:baseline;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:12px}
.conn:hover{background:rgba(255,255,255,.06)}
.conn .d{font:700 11px Menlo,monospace;color:var(--gold-solid);width:12px;flex-shrink:0}
.conn .n{font-weight:650;flex-shrink:0}.conn .l{color:var(--faint);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#search{width:100%;margin-top:8px;padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;font:12px Menlo,monospace}

.cont{border-bottom:1px solid var(--line)}
.cont > summary{list-style:none;cursor:pointer;padding:9px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.cont > summary::-webkit-details-marker{display:none}
.cont > summary b{font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.cont > summary span{font:10px Menlo,monospace;color:var(--faint)}
.cont.on > summary b{filter:brightness(1.15)}
.row{display:grid;grid-template-columns:14px 1fr;gap:2px 7px;padding:5px 6px;border-radius:6px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.06)}
.row.on{background:rgba(214,176,87,.14);box-shadow:inset 2px 0 0 #d6b057}
.row .mark{margin-top:3px}.row .nm{font-size:12px;font-weight:650}
.row .sm{grid-column:2;font-size:10.5px;color:var(--faint);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:3;font:700 10px Menlo,monospace;letter-spacing:.14em;color:rgba(255,255,255,.55);transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:12px Menlo,monospace;color:var(--dim);z-index:9}
#tabs{display:none}
#c-close{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--faint);font-size:18px;cursor:pointer}#c-close:hover{color:#fff}
#card .ph{position:relative}
.rtabs{display:flex;gap:4px;margin-bottom:2px}.rtabs button{flex:1;font:700 9px Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;padding:6px 4px;border-radius:5px;border:1px solid var(--line);background:none;color:var(--faint);cursor:pointer}
.rtabs button.on{color:#000;background:var(--gold);border-color:#c99a35}
#index:not(.idx) #search{display:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:11.5px}.kv dt{color:var(--faint);font:10px Menlo,monospace;letter-spacing:.06em;padding-top:2px}.kv dd{color:rgba(255,255,255,.85)}

.spark{display:block;margin-top:6px}
.li{display:flex;gap:8px;align-items:baseline;padding:4px 4px;border-radius:5px;cursor:pointer;font-size:12px}.li:hover{background:rgba(255,255,255,.06)}
.li .n{font-weight:620;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .v{font:10.5px Menlo,monospace;color:var(--dim);flex-shrink:0}

.src{font:9px Menlo,monospace;color:var(--faint);margin-top:4px;line-height:1.4}
@media (max-width: 899px){
  #header{height:56px;gap:8px;padding:0 10px}

  body.tab-index #index{display:flex} body.tab-index #card{display:none}
  #tabs{display:flex;position:absolute;left:8px;right:8px;bottom:calc(42vh - 32px);z-index:5;gap:6px}

  #hint{display:none}
  #crumb{display:none}
  #brand{font-size:9px;letter-spacing:.16em;flex:1;overflow:hidden;text-overflow:ellipsis}
  #depth button{padding:4px 4px;font-size:8px;letter-spacing:.04em}
  #graph-btn{padding:5px 7px}
}

<script type="module">
// globe.html — a globe view of a system map (the HARK map or any map in maps/). The map's own data, nothing invented:
// continents = clusters (HARK map: one per category; maps with orbit hubs: one per hub), islands = nodes, the centre
// node (Cannamax / NOEMA) at the north pole, and the map's real edges drawn as great-circle strands between the exact
// islands. Hairline contour strands draw the land; open ocean keeps only faint decorative webbing. Black, white and
// metallic gold only: gold marks the islands, continent names, the focus reticle and the focused node's real edges.
// Depth levels [globe, lens, dome, detail]: the dark ball from outside → a lens opens onto the light interior → the dome
// close-up → DETAIL, a crisp radial breakdown of the focused node and everything it is really wired to. Physics: still
// at rest; drag spins with momentum and friction and settles onto the nearest island / continent; pinch or scroll zooms
// through the depth levels; the index flies anywhere in one click; ?focus=<id> deep-links.

THREE.ColorManagement.enabled = false;
const q = new URLSearchParams(location.search), slug = q.get('map') || '';
const REPO = 'TheMaxLong/HARK-System-Map', FILE = slug ? `maps/${slug}.json` : 'map-state.json';

  return null;
}
const HARK_CATS = { flagship: 'Flagship', app: 'Applications', data: 'Data Pipeline', display: 'Display / Mobile', infra: 'Infrastructure', hardware: 'Hardware',
  external: 'External', future: 'Future Platform', origin: 'Origin', dream: 'Dream / Vision', market: 'Market / Opp', commercial: 'HARK Box · Commercial', site: 'Site' };
const statusKind = s => ({ live: 0, installed: 0, building: 0, wip: 0, parked: 1, archived: 1, retiring: 1, disarmed: 1, idea: 2, dream: 2, planned: 2 }[s] ?? 0);
const markClass = s => ['live', 'hollow', 'dotted'][statusKind(s)];
function parseNotes(notes) {                                    // the dated changelog inside a node's notes, newest first
  const t = String(notes || '').trim(); if (!t) return [];
  const parts = t.split(/(?=(?:^|\s)\d{4}-\d{2}-\d{2}\b[^:]{0,80}:)/).map(s => s.trim()).filter(Boolean);
  return parts.map((p, i) => { const m = p.match(/^(\d{4}-\d{2}-\d{2})([^:]{0,80}):\s*([\s\S]*)$/); return m ? { date: m[1], tag: m[2].trim(), text: m[3].trim(), i } : { date: '', tag: '', text: p, i }; })
    .sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.i - a.i);
}
const firstLine = (s, n = 90) => { const t = clean(s); const one = t.split(/(?<=[.!?])\s/)[0] || t; return one.length > n ? one.slice(0, n - 1).trimEnd() + '…' : one; };

// ---------------------------------------------------------------- model: continents, islands, pole, real edges
function buildModel(d) {
  const nodes = (d.nodes || []).map((n, i) => ({ ...n, i, name: clean(n.label) || n.id }));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const edges = (d.edges || []).filter(e => byId.has(e.s) && byId.has(e.t) && e.s !== e.t);
  const adj = new Map(nodes.map(n => [n.id, []]));
  edges.forEach((e, k) => { adj.get(e.s).push({ id: e.t, dir: 'out', label: e.label || '', k }); adj.get(e.t).push({ id: e.s, dir: 'in', label: e.label || '', k }); });

  let pole = null, continents = [];

    const hubIds = new Set(hubs.map(h => h.id));
    pole = nodes.find(n => !hubIds.has(n.id) && hubs.every(h => adj.get(n.id).some(a => a.id === h.id))) || null;
    const taken = new Set([...(pole ? [pole.id] : []), ...hubIds]);
    continents = hubs.map(h => ({ id: h.id, name: h.name, hub: h, members: [] }));
    for (const c of continents) for (const a of adj.get(c.hub.id)) { if (!taken.has(a.id)) { taken.add(a.id); c.members.push(byId.get(a.id)); } }
    const rest = nodes.filter(n => !taken.has(n.id)); if (rest.length) continents.push({ id: 'other', name: 'Unassigned', hub: null, members: rest });

}

// ---------------------------------------------------------------- geography: seeded, so the same map always draws the
// same world. Continent centres in one or two rings round the globe; each continent a noise-edged mainland with its
// islands offshore on a sunflower spiral (biggest nearest the coast); the hub node (if any) sits on the mainland.
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hashStr = s => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };
const sph = (lon, lat) => new THREE.Vector3(Math.cos(lat) * Math.sin(lon), Math.sin(lat), Math.cos(lat) * Math.cos(lon));
function frame(c) { const up = Math.abs(c.y) > 0.95 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0); const e1 = up.clone().cross(c).normalize(), e2 = c.clone().cross(e1); return { c, e1, e2 }; }

function blob(f, r, seed) { const R = rng(seed), k = [2, 3, 4, 5, 7].map(n => ({ n, a: (0.16 + R() * 0.1) / Math.sqrt(n), p: R() * tau })); return { f, r, edge: th => r * (1 + k.reduce((s, q) => s + q.a * Math.sin(q.n * th + q.p), 0)) }; }
function layoutWorld(M) {
  // the whole sphere: a Fibonacci spread of continent centres (south pole included, a cap kept clear round the north
  // pole node), then a size-aware relaxation so every continent's islands have room
  const K = M.continents.length, R = rng(hashStr(slug || 'hark')), north = new THREE.Vector3(0, 1, 0);
  // a sparser map gets bigger islands set closer to their coast, so the globe reads full rather than scattered
  // (Personal, 55 nodes → 1.5×; the 96-node HARK map keeps 1×)
  const IS = M.nodes.length < 70 ? 1.5 : 1, GAP = 0.045 - 0.015 * (IS - 1) * 2, STEP = 0.047 * (1 + 0.12 * (IS - 1) * 2);
  M.islandScale = IS;
  const est = c => 0.055 + 0.019 * Math.sqrt(c.members.length + (c.hub ? 2 : 0)) + GAP + (IS - 1) * 0.01 + STEP * Math.sqrt(c.members.length + 0.35);
  const order = [...M.continents].sort((a, b) => est(b) - est(a));
  order.forEach((c, i) => { const y = 0.72 - 1.66 * (i + 0.5) / K, r = Math.sqrt(1 - y * y), th = i * 2.39996 + 0.6; c.p = new THREE.Vector3(r * Math.sin(th), y, r * Math.cos(th)); c.est = est(c); });

    const push = new THREE.Vector3();

    if (M.pole) { const ang = a.p.angleTo(north), want = a.est + 0.16; if (ang < want) push.add(a.p.clone().sub(north).normalize().multiplyScalar((want - ang) * 0.5)); }

  M.continents.forEach(c => {
    c.f = frame(c.p);
    const n = c.members.length; c.rm = 0.055 + 0.019 * Math.sqrt(n + (c.hub ? 2 : 0));
    c.land = blob(c.f, c.rm, hashStr(c.id));
    if (c.hub) { c.hub.p = c.p.clone(); c.hub.r = 0.03; }
    const th0 = R() * tau;
    c.members.forEach((m, j) => { const th = th0 + j * 2.39996, base = c.land.edge(th); m.r = (0.014 + 0.0008 * (m.sz || 14)) * IS; m.p = offset(c.f, base + GAP + (IS - 1) * 1.2 * m.r + STEP * Math.sqrt(j + 0.35), th); });

// ---------------------------------------------------------------- renderer + overlay
const W = innerWidth, H = innerHeight;

const cam = new THREE.PerspectiveCamera(50, 1, 0.02, 20), darkCam = new THREE.PerspectiveCamera(40, 1, 0.02, 20);

const U = { ink: { value: new THREE.Color() }, gain: { value: 1 }, gold: { value: new THREE.Color() }, focus: { value: -1 }, focusCont: { value: -1 }, hasFocus: { value: 0 },
